<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>DualSense Signing Tester</title>
	<style>
		:root {
			--accent: #6366f1;
			--accent2: #818cf8;
			--ink: #fff;
			--muted: #9aa3bd;
			--card: #ffffff0d;
			--line: #ffffff1a;
			--bg: #12141c;
		}

		* {
			box-sizing: border-box
		}

		body {
			margin: 0;
			min-height: 100vh;
			color: var(--ink);
			font-family: Avenir, "Segoe UI", Helvetica, Arial, sans-serif;
			background: linear-gradient(#6366f114 0%, #0000 32%), var(--bg);
			display: flex;
			justify-content: center;
			padding: 56px 20px 40px;
		}

		.wrap {
			width: 100%;
			max-width: 440px;
			text-align: center
		}

		h1 {
			font-size: 26px;
			font-weight: 800;
			margin: 0 0 6px;
			background: linear-gradient(#c7d2fe, #fff 60%);
			-webkit-background-clip: text;
			background-clip: text;
			color: transparent;
		}

		.sub {
			color: var(--muted);
			margin: 0 0 28px;
			font-size: 14px;
			line-height: 1.5
		}

		button {
			font: inherit;
			font-weight: 700;
			font-size: 15px;
			cursor: pointer;
			color: #fff;
			background: var(--accent);
			border: 0;
			border-radius: .6em;
			padding: 12px 22px;
			transition: background .12s, transform .05s;
		}

		button:hover {
			background: var(--accent2)
		}

		button:active {
			transform: translateY(1px)
		}

		button.ghost {
			background: #ffffff12;
			color: var(--ink)
		}

		button.ghost:hover {
			background: #ffffff1f
		}

		button:disabled {
			opacity: .5;
			cursor: not-allowed
		}

		#panel {
			margin-top: 8px
		}

		.dev {
			color: var(--muted);
			font-size: 13px;
			margin-bottom: 16px
		}

		.dev b {
			color: var(--ink)
		}

		.verdict {
			border-radius: .9em;
			padding: 20px 18px;
			margin-bottom: 22px;
			font-size: 17px;
			font-weight: 800;
			line-height: 1.35;
			background: var(--card);
			border: 1px solid var(--line)
		}

		.verdict .note {
			display: block;
			font-size: 12.5px;
			font-weight: 500;
			color: var(--muted);
			margin-top: 8px
		}

		.verdict.ok {
			background: linear-gradient(#22c55e26, #22c55e0d);
			border-color: #22c55e59
		}

		.verdict.warn {
			background: linear-gradient(#eab30826, #eab3080d);
			border-color: #eab30859
		}

		.verdict.bad {
			background: linear-gradient(#ef444426, #ef44440d);
			border-color: #ef444459
		}

		.checks {
			background: var(--card);
			border: 1px solid var(--line);
			border-radius: .9em;
			overflow: hidden;
			text-align: left
		}

		.check {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 15px 18px
		}

		.check+.check {
			border-top: 1px solid var(--line)
		}

		.check .label {
			font-weight: 600
		}

		.pill {
			font-size: 12px;
			font-weight: 800;
			padding: 5px 12px;
			border-radius: 999px;
			white-space: nowrap
		}

		.pill.wait {
			background: #ffffff1a;
			color: var(--muted)
		}

		.pill.ok {
			background: #22c55e;
			color: #0a2a12
		}

		.pill.warn {
			background: #eab308;
			color: #332800
		}

		.pill.bad {
			background: #ef4444;
			color: #3a0a0a
		}

		#again {
			margin-top: 22px
		}

		.warnbox {
			margin-top: 22px;
			background: #ef44441a;
			border: 1px solid #ef444459;
			color: #fca5a5;
			border-radius: .7em;
			padding: 14px 16px;
			font-size: 13px;
			line-height: 1.5;
			text-align: left
		}
	</style>
</head>

<body>
	<a href="https://github.com/Pelsin/DualSense-Signing-Tester" class="github-corner" aria-label="View source on GitHub">
		<svg width="80" height="80" viewBox="0 0 250 250" style="
          fill: #fff;
          color: rgb(2 6 23);
          position: absolute;
          top: 0;
          border: 0;
          right: 0;
        " aria-hidden="true">
			<path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"></path>
			<path
				d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2"
				fill="currentColor" style="transform-origin: 130px 106px" class="octo-arm"></path>
			<path
				d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z"
				fill="currentColor" class="octo-body">
			</path>
		</svg>
	</a>
	<style>
		.github-corner:hover .octo-arm {
			animation: octocat-wave 560ms ease-in-out;
		}

		@keyframes octocat-wave {

			0%,
			100% {
				transform: rotate(0);
			}

			20%,
			60% {
				transform: rotate(-25deg);
			}

			40%,
			80% {
				transform: rotate(10deg);
			}
		}

		@media (max-width: 500px) {
			.github-corner:hover .octo-arm {
				animation: none;
			}

			.github-corner .octo-arm {
				animation: octocat-wave 560ms ease-in-out;
			}
		}
	</style>
	<div class="wrap">
		<h1>DualSense Signing Tester</h1>
		<p class="sub">Checks if a controller signs its inputs like a genuine PS5 controller</p>
		<button id="connect">Connect controller</button>
		<div id="panel" hidden>
			<div class="dev" id="devname"></div>
			<div class="verdict" id="verdict"></div>
			<div class="checks">
				<div class="check"><span class="label">DualSense controller</span><span class="pill wait"
						id="p_ident">…</span>
				</div>
				<div class="check"><span class="label">Signed inputs</span><span class="pill wait" id="p_sign">…</span>
				</div>
			</div>
			<button id="again" class="ghost">Test again</button>
		</div>
		<div class="warnbox" id="ctxwarn" hidden></div>
	</div>

	<script>
		"use strict";


		const $ = s => document.querySelector(s);
		let dev = null;

		const pill = (id, cls, text) => { $("#p_" + id).className = "pill " + cls; $("#p_" + id).textContent = text; };
		const verdict = (cls, text, note) => {
			$("#verdict").className = "verdict " + cls;
			$("#verdict").innerHTML = text + (note ? `<span class="note">${note}</span>` : "");
		};
		const feat = async id => { try { return new Uint8Array((await dev.receiveFeatureReport(id)).buffer); } catch { return null; } };

		async function identity() {
			let identityOK = true;
			for (const id of [0x05, 0x09, 0x20]) if (!await feat(id)) identityOK = false;
			pill("ident", identityOK ? "ok" : "bad", identityOK ? "Yes" : "No");
			return identityOK;
		}

		const SIGN = { none: ["warn", "No input"], unsigned: ["bad", "Unsigned"], static: ["warn", "Static"], signed: ["ok", "Signed"] };
		function signing() {
			return new Promise(done => {
				const caps = [];
				const on = ev => {
					if (ev.reportId === 0x01 && caps.length < 40) {
						const f = new Uint8Array(1 + ev.data.byteLength); f[0] = 1; f.set(new Uint8Array(ev.data.buffer), 1); caps.push(f);
					}
				};
				dev.addEventListener("inputreport", on);
				setTimeout(() => {
					dev.removeEventListener("inputreport", on);
					let key = "none";
					if (caps.length) {
						let changed = 0, nz = false, prev = null;
						for (const r of caps) {
							const t = r.slice(-8); nz ||= t.some(x => x);
							if (prev && t.some((x, i) => x !== prev[i])) changed++; prev = t;
						}
						const rate = changed / (caps.length - 1 || 1);
						key = !nz ? "unsigned" : rate > 0.8 ? "signed" : "static";
					}
					pill("sign", ...SIGN[key]); done(key);
				}, 1200);
			});
		}

		async function run() {
			$("#again").disabled = true;
			pill("ident", "wait", "…"); pill("sign", "wait", "…"); verdict("", "Testing…");
			const isDS = await identity();
			const sign = await signing();
			if (sign === "signed") verdict("ok", "Inputs are signed", "This controller signs its input reports like a real PS5 pad");
			else if (isDS) verdict("warn", "Inputs not signing", "Its input reports don't carry a changing per-report signature");
			else verdict("bad", "Not a DualSense", "This isn't a PS5-style controller.");
			$("#again").disabled = false;
		}

		async function connect() {
			try {
				const [d] = await navigator.hid.requestDevice({ filters: [] });
				if (!d) return;
				if (!d.opened) await d.open();
				dev = d;
				$("#devname").innerHTML = `Connected: <b>${d.productName || "controller"}</b>`;
				$("#connect").hidden = true; $("#panel").hidden = false;
				run();
			} catch { }
		}

		$("#connect").onclick = connect;
		$("#again").onclick = run;
		if (!("hid" in navigator)) {
			$("#connect").disabled = true;
			$("#ctxwarn").hidden = false;
			$("#ctxwarn").innerHTML = "WebHID isn't available. Use <b>Chrome or Edge</b>";
		}
	</script>
</body>

</html>
